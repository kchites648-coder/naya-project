<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel:ELSH@88.7&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montenegrin+Gothic+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=trending_flat" />
  <style>
  .material-symbols-outlined {
    font-variation-settings:
    'FILL' 0,
    'wght' 400,
    'GRAD' 0,
    'opsz' 24
  }
  </style>
  <link rel="stylesheet" href="Style.css">
</head>

<body>
  <div class="man">
    <p id="sp">* TODAY IS VERY SPECIAL DAY *</p>
    <h1 id="br">Happy</h1>
    <h1 id="da">Birthday</h1>
    <p id="b">My Beautiful Love</p>
    <img id="img" src="11524-removebg-preview.png" alt="logo">

    <img src="Heart.png" class="bgheart bgheart1" alt="">
    <img src="Heart.png" class="bgheart bgheart2" alt="">

    <span class="sparkle sp1">✦</span>
    <span class="sparkle sp2">✧</span>
    <span class="sparkle sp3">✦</span>

    <div class="lockcard">
      <h2 id="enter">Enter Passcode</h2>
      <p id="hinttext">Enter secret passcode to unlock your special birthday surprise ❤</p>

      <div class="inpu">
        <input class="passbox" type="text" required>
        <input class="passbox" type="text" required>
        <input class="passbox" type="text" required>
        <input class="passbox" type="text" required>
      </div>

      <div class="key">
        <button class="keybtn">1</button>
        <button class="keybtn">2</button>
        <button class="keybtn">3</button>
        <button class="keybtn">4</button>
        <button class="keybtn">5</button>
        <button class="keybtn">6</button>
        <button class="keybtn">7</button>
        <button class="keybtn">8</button>
        <button class="keybtn">9</button>
        <button class="keybtn">*</button>
        <button class="keybtn">0</button>
        <button class="keybtn">⌫</button>
      </div>

      <div class="hintwrap">
        <button class="hint">Hint: Special Pin 🌸</button>
      </div>
    </div>

    <div class="btnwrap">
      <button id="openbtn">
  OPEN YOUR SURPRISE
  <span class="material-symbols-outlined">trending_flat</span>
      </button>
    </div>
  </div>
</body>
</html>
