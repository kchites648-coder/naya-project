<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Hint 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffe6eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }
    .hint-card {
      background-color: #fff5f8;
      border-radius: 20px;
      padding: 40px 20px;
      width: 85%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(219, 39, 119, 0.25);
      border: 2px dashed #ffb6c1;
    }
    h1 {
      color: #d1225b;
      font-family: 'Merriweather', serif;
      margin-bottom: 15px;
      font-size: 28px;
    }
    p {
      color: #8a7086;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .highlight {
      color: #ff3366;
      font-size: 22px;
      font-weight: 600;
      display: block;
      margin-top: 10px;
    }
    .back-btn {
      background: linear-gradient(90deg, #e91e63, #d6336c);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(214, 51, 108, 0.35);
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="hint-card">
    <h1>Need a Hint? 🤭</h1>
    <p>Think about the most special day of the year... <br>
       <span class="highlight">Your Birthday! 🎂</span><br>
       <small>(Format: Date & Month)</small>
    </p>
    <!-- Zaroori Note: Agar tere pehle page ka naam kuch aur hai (jaise passcode.html), toh yahan 'index.html' ki jagah wo naam daal dena -->
    <a href="index.html" class="back-btn">Got it! Let me in 🏃‍♀️</a>
  </div>

</body>
</html>
